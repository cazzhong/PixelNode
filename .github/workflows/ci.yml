name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows runner 沒有實體 GPU，wgpu 會退回 DX12 WARP 軟體 adapter。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bench:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark (100 nodes, 256x256, 60 frames)
        env:
          PIXELNODE_BENCH_CHECK: "1"
        run: cargo bench -p pixelnode-bench | Tee-Object -FilePath bench.md
      - run: Get-Content bench.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: bench-pipeline
          path: |
            bench.md
            target/bench-pipeline.json
